<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아르카디아 원정대 · 웹 체험판</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102b32;color:#f4e6bb;font-family:system-ui,sans-serif}
canvas{display:block;outline:none;image-rendering:pixelated}
#cover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#102b32;z-index:5;padding:24px;text-align:center}
h1{color:#ead48d}p{max-width:640px;line-height:1.7}button{padding:16px 40px;font-size:20px;background:#254d52;border:3px solid #d7bd72;color:#fff1ca;cursor:pointer}
progress{width:min(500px,85vw);margin:22px}#error{color:#ffb49a;white-space:pre-wrap}
</style><link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
</head><body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="cover"><h1>아르카디아 원정대</h1><p>5:5 턴제 원정 · 웹 체험판</p>
<p>진행은 이 브라우저에 자동 저장됩니다.<br>다른 PC·브라우저와 공유되지 않으며, 사이트 데이터를 삭제하면 초기화됩니다.<br>비공개 창에서는 저장이 유지되지 않을 수 있습니다.</p>
<button id="play">모험 시작</button><progress id="progress" hidden></progress><p id="error"></p></div>
<script src="index.js"></script><script>
const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":81369376,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engine=new Engine(config);
const play=document.getElementById('play'),progress=document.getElementById('progress'),error=document.getElementById('error');
window.arcadiaHasLock=false;
function fail(e){error.textContent=String(e.message||e);play.disabled=false;play.textContent='다시 시도';}
async function boot(){
  if(!navigator.locks || !window.indexedDB) throw Error('저장 기능을 사용할 수 없습니다. HTTPS에서 최신 Chrome 또는 Edge로 실행해 주세요.');
  const missing=Engine.getMissingFeatures({threads:false});
  if(missing.length) throw Error('브라우저에서 지원하지 않는 기능: '+missing.join(', '));
  await navigator.locks.request('arcadia-expedition-web-save',{ifAvailable:true},async lock=>{
    if(!lock){fail('다른 탭에서 게임이 실행 중입니다. 해당 탭을 닫은 후 다시 시도해 주세요.');return;}
    window.arcadiaHasLock=true;
    progress.hidden=false;
    try{
      await engine.startGame({canvas:document.getElementById('canvas'),onProgress:(n,total)=>{progress.max=total||1;progress.value=n;},
        onExit:()=>{document.getElementById('cover').style.display='flex';play.textContent='다시 시작';play.disabled=false;play.onclick=()=>location.reload();}});
      document.getElementById('cover').style.display='none';
      document.getElementById('canvas').focus();
      if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
      await new Promise(()=>{}); // Released by browser on tab close/crash; no stale lock file.
    }catch(e){window.arcadiaHasLock=false;fail(e);}
  });
}
play.onclick=()=>{play.disabled=true;error.textContent='';boot().catch(fail);};
</script></body></html>
